name: Bug report
description: Report a reproducible problem with the Beads bb plugin.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private issue data, or unredacted filesystem paths.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include bb, plugin, bd, OS, and browser/device versions.
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection mode
      options:
        - Local bb
        - bb Connect / remote client
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Describe the selected project/host, steps, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, private issue content, and absolute paths before attaching.
